name: Stats y frases LonkoDev

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjetas
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/stats.py

      - name: Rotar frases del README
        run: python3 scripts/frases.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "chore: actualiza stats y frases [skip ci]"
          git push
