name: Snake de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F1882D&color_dots=#1A1A1A,#5a3412,#a35c1f,#d4741f,#F1882D
            dist/snake-dark.svg?palette=github-dark&color_snake=#F1882D&color_dots=#161b22,#5a3412,#a35c1f,#d4741f,#F1882D

      - name: Publicar en rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
